; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
default_envs = esp32-s3-devkitc-1

[env:esp32-s3-devkitc-1]
platform = espressif32
board = esp32-s3-devkitc-1
framework = arduino

board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.partitions = partitions.csv
board_build.filesystem = littlefs
board_build.extra_flags =
  -DBOARD_HAS_PSRAM
  -DARDUINO_USB_CDC_ON_BOOT=1
  ; The web server's network task (priority 10) on core 0 with Wi-Fi, so it
  ; never interrupts the player task (core 1) mid-piece.
  -DCONFIG_ASYNC_TCP_RUNNING_CORE=0

; Exact versions, so every build (USB, over Wi-Fi, a fresh clone) is the same
lib_deps =
  fastled/FastLED@3.10.3
  ESP32Async/ESPAsyncWebServer@3.12.1
  ESP32Async/AsyncTCP@3.5.0
  bblanchon/ArduinoJson@7.4.3

monitor_speed = 115200
; Stamps the firmware's version, and passes it secrets.ini's; gzips the web
; files in the file system image (see the scripts).
extra_scripts =
  pre:scripts/build_info.py
  pre:scripts/gzip_web.py

; The same firmware, uploaded over Wi-Fi to the controller (piano.local):
;   pio run -e ota -t upload      the firmware
;   pio run -e ota -t uploadfs    the web files and velocity table
; The password is secrets.ini's ota_password. The partition table can only be
; changed over USB.
[env:ota]
extends = env:esp32-s3-devkitc-1
upload_protocol = espota
upload_port = piano.local
extra_scripts =
  pre:scripts/build_info.py
  pre:scripts/gzip_web.py
  post:scripts/ota_upload.py

; Unit tests for the hardware-independent code, run on this computer:
;   pio test -e native
[env:native]
platform = native
test_framework = unity
test_build_src = yes
build_src_filter = -<*> +<app/midi/> +<app/piano/roll_builder.cpp> +<app/piano/roll_repeats.cpp> +<app/piano/velocity_table.cpp> +<app/piano/velocity_table_load.cpp> +<app/piano/play_config.cpp> +<app/piano/key_offsets.cpp> +<app/piano/note_edits.cpp> +<app/piano/heat_model.cpp> +<app/library/library_index.cpp>
lib_deps = bblanchon/ArduinoJson@7.4.3
build_flags = -std=c++17 -Wall -Wextra -fsanitize=address,undefined -fno-sanitize-recover=all
