; Copy to secrets.ini (gitignored) and fill in. Read at build time by
; scripts/build_info.py and scripts/ota_upload.py.
[secrets]
; The Wi-Fi the controller joins when it hasn't saved one of its own (set on
; its Wi-Fi page, or over USB with: WIFI "network" "password"). Optional.
wifi_ssid =
wifi_password =
; Needed to update over Wi-Fi (pio run -e ota -t upload / -t uploadfs); with
; none, the controller doesn't accept updates over Wi-Fi.
ota_password =
