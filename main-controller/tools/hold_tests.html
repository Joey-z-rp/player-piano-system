<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hold tests</title>
<!-- Page template for `hold_tests.py report`, which replaces the data
     placeholder near the end. -->
<style>
  :root {
    color-scheme: light;
    --bg: #f6f6f3; --panel: #fcfcfb; --fg: #0b0b0b; --muted: #5f5e5a; --line: #e1e0d9;
    --grid: #ecebe5; --popover: #ffffff; --mark: #8a8984;
    --s1: #2a78d6; --s2: #eb6834; --s3: #1baf7a;
    --ramp-from: #b9d4f5; --ramp-to: #0d3c78;
  }
  @media (prefers-color-scheme: dark) {
    :root {
      color-scheme: dark;
      --bg: #0d0d0d; --panel: #1a1a19; --fg: #ffffff; --muted: #a9a89f; --line: #2c2c2a;
      --grid: #262624; --popover: #242422; --mark: #77766f;
      --s1: #3987e5; --s2: #d95926; --s3: #199e70;
      --ramp-from: #1d4a85; --ramp-to: #cfe2fa;
    }
  }
  [hidden] { display: none !important; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 14px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; }
  main { max-width: 76rem; margin-inline: auto; padding: 24px clamp(16px, 4vw, 40px) 48px; display: grid; gap: 20px; }
  h1 { margin: 0; font: 400 30px/1.2 Georgia, "Times New Roman", serif; }
  h2 { margin: 0; font-size: 16px; font-weight: 600; }
  h3 { margin: 0; font-size: 14px; font-weight: 600; }
  p { margin: 0; color: var(--muted); max-width: 72ch; }
  .card { background: var(--panel); border: 1px solid var(--line); border-radius: 8px; padding: 20px; display: grid; gap: 12px; min-width: 0; }
  .charts { display: grid; grid-template-columns: repeat(auto-fit, minmax(min(100%, 22rem), 1fr)); gap: 20px; align-items: start; }
  .chart.wide { grid-column: 1 / -1; }
  .chart { display: grid; gap: 6px; min-width: 0; }
  .plot { position: relative; }
  .plot svg { display: block; overflow: visible; }
  .tick { font-size: 12px; fill: var(--muted); font-variant-numeric: tabular-nums; }
  .note { font-size: 12px; fill: var(--muted); }
  .legend { display: flex; flex-wrap: wrap; gap: 6px 16px; font-size: 12px; color: var(--muted); }
  .legend span { display: inline-flex; align-items: center; gap: 6px; }
  .swatch { width: 14px; height: 0; border-top: 2px solid; }
  .tip { position: absolute; pointer-events: none; z-index: 2; white-space: nowrap; font-size: 12px; background: var(--popover);
    border: 1px solid var(--line); border-radius: 8px; padding: 4px 8px; box-shadow: 0 4px 16px rgba(0, 0, 0, .12); }
  .tip-head { color: var(--muted); }
  .tip div + div { padding-left: 6px; }
</style>
<script src="https://cdnjs.cloudflare.com/ajax/libs/d3/7.8.5/d3.min.js"></script>
</head>
<body>
<main>
  <header>
    <h1>Hold tests</h1>
    <p id="generated"></p>
  </header>
  <div id="keys"></div>
</main>

<script>window.HOLD = __HOLD_DATA__;</script>
<script>
(() => {
  const data = window.HOLD;
  const f1 = d3.format('.1f');
  const css = (name) => getComputedStyle(document.documentElement).getPropertyValue(name).trim();
  const variantColor = (v) => `var(--s${data.variants.indexOf(v) % 3 + 1})`;
  const fmtDuty = (d) => `${+d.toFixed(2)}%`;
  document.getElementById('generated').textContent = `Generated ${data.generated} from ${data.source}`;

  const names = {
    long: `long (${data.long_ms} ms strike, no hold)`,
    '50 + hold': `${data.strike_ms} ms strike + ${data.hold_duty}% hold (today)`,
    '50 only': `${data.strike_ms} ms strike, no hold`,
  };

  // A line chart with a crosshair tooltip. series: [{name, color, points: [[x, y, label?]]}]
  function lineChart(box, { series, xDomain, yDomain, xFormat, yFormat, xLabel, xTicks, refs = [], height = 260, label }) {
    const W = box.clientWidth || 340, H = height;
    const m = { left: 56, right: 10, top: 10, bottom: 34 };
    const x = d3.scaleLinear(xDomain, [m.left, W - m.right]);
    const y = d3.scaleLinear(yDomain, [H - m.bottom, m.top]).nice();
    const svg = d3.select(box).append('svg').attr('width', '100%').attr('viewBox', `0 0 ${W} ${H}`)
      .attr('role', 'img').attr('aria-label', label);
    y.ticks(5).forEach((t) => {
      svg.append('line').attr('x1', m.left).attr('x2', W - m.right).attr('y1', y(t)).attr('y2', y(t)).attr('stroke', 'var(--grid)');
      svg.append('text').attr('class', 'tick').attr('x', m.left - 6).attr('y', y(t)).attr('text-anchor', 'end')
        .attr('dominant-baseline', 'middle').text(yFormat(t));
    });
    (xTicks || x.ticks(6)).forEach((t) => {
      svg.append('text').attr('class', 'tick').attr('x', x(t)).attr('y', H - m.bottom + 16).attr('text-anchor', 'middle')
        .text(xFormat(t));
    });
    svg.append('text').attr('class', 'note').attr('x', W - m.right).attr('y', H - 2).attr('text-anchor', 'end').text(xLabel);
    for (const ref of refs) {
      if (ref.x !== undefined) {
        svg.append('line').attr('x1', x(ref.x)).attr('x2', x(ref.x)).attr('y1', m.top).attr('y2', H - m.bottom)
          .attr('stroke', 'var(--mark)').attr('stroke-dasharray', '4 3');
        svg.append('text').attr('class', 'note').attr('x', x(ref.x) + 4).attr('y', m.top + 10).text(ref.text);
      } else {
        svg.append('line').attr('x1', m.left).attr('x2', W - m.right).attr('y1', y(ref.y)).attr('y2', y(ref.y))
          .attr('stroke', 'var(--mark)').attr('stroke-dasharray', '4 3');
        svg.append('text').attr('class', 'note').attr('x', W - m.right).attr('y', y(ref.y) - 4).attr('text-anchor', 'end')
          .text(ref.text);
      }
    }
    for (const s of series) {
      const pts = s.points.filter((p) => p[1] !== null);
      svg.append('path').attr('d', d3.line().defined((p) => p[1] !== null).x((p) => x(p[0])).y((p) => y(p[1]))(s.points))
        .attr('fill', 'none').attr('stroke', s.color).attr('stroke-width', s.width || 2)
        .attr('stroke-linejoin', 'round').attr('stroke-linecap', 'round').attr('opacity', s.opacity || 1);
      if (s.dots) {
        svg.selectAll(null).data(pts).join('circle').attr('cx', (p) => x(p[0])).attr('cy', (p) => y(p[1])).attr('r', 4)
          .attr('fill', s.color).attr('stroke', 'var(--panel)').attr('stroke-width', 2);
      }
    }
    const tip = document.createElement('div');
    tip.className = 'tip';
    tip.hidden = true;
    box.append(tip);
    const cross = svg.append('line').attr('y1', m.top).attr('y2', H - m.bottom).attr('stroke', 'var(--muted)').attr('opacity', 0);
    svg.append('rect').attr('x', m.left).attr('y', m.top).attr('width', W - m.left - m.right).attr('height', H - m.top - m.bottom)
      .attr('fill', 'transparent')
      .on('pointermove', (event) => {
        const [mx, my] = d3.pointer(event);
        const at = x.invert(mx);
        const xs = [...new Set(series.flatMap((s) => s.points.map((p) => p[0])))];
        const nearX = d3.least(xs, (v) => Math.abs(v - at));
        cross.attr('x1', x(nearX)).attr('x2', x(nearX)).attr('opacity', 0.4);
        const head = document.createElement('div');
        head.className = 'tip-head';
        head.textContent = xFormat(nearX);
        const lines = series.filter((s) => !s.quiet).map((s) => {
          const p = s.points.find((q) => q[0] === nearX);
          const line = document.createElement('div');
          line.textContent = `${s.name}: ${p && p[1] !== null ? (p[2] || yFormat(p[1])) : (p && p[2]) || 'silent'}`;
          line.style.borderLeft = `3px solid ${s.color}`;
          return line;
        });
        tip.replaceChildren(head, ...lines);
        tip.hidden = false;
        const left = mx + 14 + tip.offsetWidth > box.clientWidth ? mx - 14 - tip.offsetWidth : mx + 14;
        tip.style.left = `${Math.max(0, left)}px`;
        tip.style.top = `${Math.max(0, my - tip.offsetHeight - 10)}px`;
      })
      .on('pointerleave', () => { tip.hidden = true; cross.attr('opacity', 0); });
  }

  function legend(items) {
    const el = document.createElement('div');
    el.className = 'legend';
    el.append(...items.map(([name, color]) => {
      const item = document.createElement('span');
      const swatch = document.createElement('span');
      swatch.className = 'swatch';
      swatch.style.borderTopColor = color;
      item.append(swatch, name);
      return item;
    }));
    return el;
  }

  function chartBlock(parent, title, text, wide = false) {
    const wrap = document.createElement('div');
    wrap.className = wide ? 'chart wide' : 'chart';
    const h = document.createElement('h3');
    h.textContent = title;
    const p = document.createElement('p');
    p.textContent = text;
    const box = document.createElement('div');
    box.className = 'plot';
    wrap.append(h, p, box);
    parent.append(wrap);
    return { wrap, box };
  }

  const keysEl = document.getElementById('keys');
  const keys = [...new Set(data.summary.map((s) => s.key))].sort((a, b) => a - b);

  const draw = () => {
    keysEl.replaceChildren();
    for (const key of keys) {
      const rows = data.summary.filter((s) => s.key === key);
      const duties = [...new Set(rows.map((s) => s.duty))].sort((a, b) => a - b);
      const card = document.createElement('section');
      card.className = 'card';
      const h = document.createElement('h2');
      h.textContent = `Key ${key}`;
      const charts = document.createElement('div');
      charts.className = 'charts';
      card.append(h, legend(data.variants.map((v) => [names[v], variantColor(v)])), charts);
      keysEl.append(card);
      // Duties are spaced evenly, not by value: most of them sit close together at the soft end.
      const dutyAxis = { xDomain: [0, duties.length - 1], xTicks: d3.range(duties.length),
        xFormat: (i) => fmtDuty(duties[i]), xLabel: 'strike duty' };

      const pointsFor = (variant, field) => duties.map((d, i) => {
        const s = rows.find((r) => r.duty === d && r.variant === variant);
        if (!s) return [i, null, 'not measured'];
        if (s[field] === null) return [i, null];
        if (field === 'lands_ms') return [i, s.lands_ms, `${s.lands_ms} ms (±${f1(s.lands_spread_ms / 2)})`];
        return [i, s.peak_db, `${f1(s.peak_db)} dB${s.hits < s.strikes ? ` (${s.hits}/${s.strikes} played)` : ''}`];
      });
      // Lay out every chart before drawing any, so each is drawn at its final width.
      const env = data.envelopes.filter((e) => e.key === key);

      // 1. When the hammer lands.
      const lands = rows.filter((r) => r.lands_ms !== null).map((r) => r.lands_ms);
      const a = chartBlock(charts, 'When the hammer lands',
        `Time from sending the press to the note starting. Above the dashed line, the hammer is still in flight `
        + `when today's ${data.strike_ms} ms strike ends, so the hold is helping push it.`);
      const b = chartBlock(charts, 'How loud it plays',
        `Where the ${data.strike_ms} ms + hold line sits above the no-hold line, the hold made the note louder. `
        + 'Gaps mean the key did not play every time.');
      const c = env.length ? chartBlock(charts, 'The sound of each long strike',
        'Level in 1 ms steps, from the press. Each line is one strike, darker for higher duty; the note starts '
        + 'where its line jumps. A bump before the jump would be the solenoid itself.', true) : null;
      lineChart(a.box, { ...dutyAxis,
        series: data.variants.map((v) => ({ name: v, color: variantColor(v), points: pointsFor(v, 'lands_ms'), dots: true })),
        yDomain: [0, Math.max(d3.max(lands) || 0, data.strike_ms) * 1.15],
        yFormat: (t) => `${t} ms`, refs: [{ y: data.strike_ms, text: 'strike ends' }],
        label: `Hammer landing time against duty for key ${key}`,
      });

      // 2. Loudness.
      const peaks = rows.filter((r) => r.peak_db !== null).map((r) => r.peak_db);
      lineChart(b.box, { ...dutyAxis,
        series: data.variants.map((v) => ({ name: v, color: variantColor(v), points: pointsFor(v, 'peak_db'), dots: true })),
        yDomain: [d3.min(peaks) - 2, d3.max(peaks) + 2], yFormat: (t) => `${t} dB`, label: `Loudness against duty for key ${key}`,
      });

      // 3. Envelopes of the long strike.
      if (c) {
        const ramp = d3.interpolateRgb(css('--ramp-from'), css('--ramp-to'));
        const shade = (d) => ramp(duties.length > 1 ? duties.indexOf(d) / (duties.length - 1) : 1);
        const series = env.map((e) => ({
          name: fmtDuty(e.duty), color: shade(e.duty), width: 1.5, quiet: true,
          points: e.levels.map((v, i) => [data.envelope_start_ms + i, v]),
        }));
        const all = env.flatMap((e) => e.levels);
        const floor = d3.quantile(all, 0.05);
        lineChart(c.box, {
          series, xDomain: [data.envelope_start_ms, data.envelope_start_ms + env[0].levels.length - 1],
          yDomain: [floor - 3, d3.max(all) + 3], xFormat: (t) => `${t} ms`, yFormat: (t) => `${t} dB`,
          xLabel: 'since the press', refs: [{ x: 0, text: 'press' }, { x: data.strike_ms, text: `${data.strike_ms} ms` }],
          label: `Level envelopes of the long strikes for key ${key}`,
        });
        c.wrap.insertBefore(legend(duties.map((d) => [fmtDuty(d), shade(d)])), c.box);
      }
    }
  };

  draw();
  let pending;
  window.addEventListener('resize', () => { clearTimeout(pending); pending = setTimeout(draw, 150); });
  matchMedia('(prefers-color-scheme: dark)').addEventListener('change', draw);
})();
</script>
</body>
</html>
