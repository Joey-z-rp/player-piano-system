<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Backup</title>
<link rel="stylesheet" href="/assets/style.css">
<style>
  section { margin: 16px 0 24px; max-width: 44rem; }
  h2 { font-size: 18px; margin: 0 0 6px; }
  .hint { color: #5f5e5a; font-size: 14px; }
  .choice { display: flex; gap: 8px; align-items: flex-start; margin: 6px 0; font-size: 15px; }
  .choice input { flex: none; margin-top: 3px; }
  .choice .hint { display: block; font-size: 13px; }
  .row { display: flex; flex-wrap: wrap; gap: 8px; align-items: center; margin: 10px 0; }
  .row input[type=file] { flex: none; font-size: 14px; }
  #backup-status, #restore-status { font-size: 14px; }
  .error { color: #b3261e; }
  #restore-log { font-size: 13px; background: #f6f6f3; padding: 8px; max-height: 14em; overflow-y: auto; }
  #restore-log:empty, [hidden] { display: none; }
</style>
</head>
<body>
<h1>Backup</h1>
<p class="hint">Everything the controller keeps that isn't in the project's files: the config page's settings, the
  key offsets from the test page, and the library, with each piece's own settings (volume, speed, tracks and the
  rest). <a href="/">Home</a></p>

<section>
  <h2>Back up</h2>
  <label class="choice"><input type="checkbox" id="with-pieces" checked>
    <span>The library's pieces too <span class="hint" id="pieces-size"></span></span></label>
  <div class="row">
    <button type="button" id="backup">Download a backup</button>
    <span id="backup-status"></span>
  </div>
</section>

<section>
  <h2>Restore</h2>
  <div class="row"><input type="file" id="restore-file" accept=".zip,application/zip"></div>
  <div id="restore-choices" hidden>
    <p class="hint" id="restore-made"></p>
    <label class="choice"><input type="checkbox" id="restore-settings" checked>
      <span>Config <span class="hint">the config page's settings: replaces the current ones</span></span></label>
    <label class="choice"><input type="checkbox" id="restore-offsets" checked>
      <span>Key offsets <span class="hint" id="restore-offsets-hint"></span></span></label>
    <label class="choice"><input type="checkbox" id="restore-library" checked>
      <span>Library <span class="hint" id="restore-library-hint"></span></span></label>
    <div class="row">
      <button type="button" id="restore">Restore</button>
      <span id="restore-status"></span>
    </div>
  </div>
  <pre id="restore-log"></pre>
</section>

<script src="/backup/zip.js"></script>
<script src="/backup/backup.js"></script>
</body>
</html>
